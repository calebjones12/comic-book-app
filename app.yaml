alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
ingress: {}
name: comic-book-app
region: nyc
services:
  - name: web
    github:
      repo: calebjones12/comic-book-app
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: pnpm build
    run_command: pnpm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
